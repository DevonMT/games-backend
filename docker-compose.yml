name: games-backend

services:
  games-backend:
    mem_limit: 512m
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    build: .
    container_name: games-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      STATIC_DIR: /app/public
      BROKER_URL: http://172.30.0.1:8610
      # The broker's policy id. Unset, the code sent "games", which the broker
      # has never known: every AI call was refused as unknown_app from the
      # Backlog/Stacks split (2026-09-05) until this line.
      BROKER_APP_ID: backlog
    volumes:
      - games_data:/app/data
      # built /games + /learn pages, served SAME-ORIGIN so the Access cookie
      # covers the API calls they make (a cross-origin page cannot use Access)
      - /home/devon/apps/games-frontend:/app/public:ro
    # Least privilege, per devondoes/SPEC-network.md: each network carries one
    # relationship, and nothing else can reach this container or be reached from it.
    # The networks are created by devondoes/ops/networks.sh.
    networks:
      front_games: {}          # the gateway: Backlog and Stacks
      db_games: {}             # Postgres, as `postgres`
      link_dagster_games: {}   # Dagster's Learn sync reads /learn/sessions
      host_broker:             # the AI broker on the host, and out to RAWG and Steam
        ipv4_address: 172.30.0.13
    depends_on: []

networks:
  front_games:
    external: true
  db_games:
    external: true
  link_dagster_games:
    external: true
  host_broker:
    external: true

volumes:
  games_data:
